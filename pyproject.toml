[project]
name = "tag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "plotly>=7.1.0",
]

[project.scripts]
tag = "tag:main"

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/tag"]
# A persistent build dir makes rebuilds incremental (only changed C++ recompiles).
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"

[tool.uv]
# Build with the nanobind version locked for the dev group, so the compiled module and the stub
# check in tests/propagation/test_stub.py always use the same nanobind.
extra-build-dependencies = { tag = [{ requirement = "nanobind", match-runtime = true }] }
# Rebuild the extension on `uv sync`/`uv run` only when one of these changes. Python files are
# served live from src/ by scikit-build-core's editable redirect, so they need no rebuild.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*" },
    { env = "SKBUILD_CMAKE_DEFINE" },
]

[dependency-groups]
dev = [
    "clang-format>=23.1.5",
    "cmake>=4.4.5",
    "mypy>=2.4.1",
    "nanobind>=3.1.0",
    "ninja>=1.13.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.mypy]
files = ["src", "tests", "examples"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/filtering and tests/propagation hold same-named files without __init__.py
addopts = ["--import-mode=importlib"]
