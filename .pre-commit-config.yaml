# Run `uv run pre-commit install` once per clone to enable (installs both the
# pre-commit and commit-msg hooks listed below).
# Ruff, mypy and clang-format hooks call the versions pinned in uv.lock, so they match manual runs.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Blocks files containing private keys (SSH, PEM, PGP, PuTTY, ...).
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # Checks the whole project (files from [tool.mypy]), not just staged files,
        # so cross-module type errors are caught.
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: clang-format
        name: clang-format
        # Style from .clang-format; formats in place, so a change stops the commit for review.
        entry: uv run clang-format -i
        language: system
        types_or: [c++, c]

      # Commit messages must reference an issue (#N) on a non-comment line, e.g.
      # "#12 add X". Merge, revert and fixup/squash/amend commits made by git are exempt.
      # pygrep's --multiline also sets DOTALL, so use [^\n]* (not .*) to stay on one line.
      - id: commit-msg-issue-ref
        name: commit message references an issue (#N)
        language: pygrep
        entry: '(?m)(^(?!# |#$)[^\n]*#[0-9]+|\A(Merge|Revert|fixup!|squash!|amend!) )'
        args: [--multiline, --negate]
        stages: [commit-msg]
