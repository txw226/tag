name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    env:
      # Portable binaries: CI runners have varying CPUs, so no -march=native.
      SKBUILD_CMAKE_DEFINE: TAG_NATIVE=OFF
      # Compile through ccache (cached across runs below); CMake reads this from the environment.
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5

      # Installs uv; uv then installs the Python pinned in .python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cxx

      # --locked fails if uv.lock is out of date with pyproject.toml. Also compiles the C++ extension.
      - run: uv sync --locked

      # Same checks as the pre-commit hook, but report-only (no --fix).
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy
      - name: clang-format
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 uv run clang-format --dry-run --Werror
      - name: detect private keys
        run: uv run pre-commit run detect-private-key --all-files

      - name: pytest
        run: uv run pytest -q
