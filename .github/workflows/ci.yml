name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs uv; uv then installs the Python pinned in .python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      # Same checks as the pre-commit hook, but report-only (no --fix).
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy
      - name: detect private keys
        run: uv run pre-commit run detect-private-key --all-files

      - name: pytest
        run: uv run pytest -q
